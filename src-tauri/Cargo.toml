[package]
name = "outfit_mapper"
version = "0.1.0"
description = "OutFit Mapper desktop MVP"
authors = ["Codex"]
edition = "2021"

[lib]
name = "outfit_mapper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0.0", features = [] }

